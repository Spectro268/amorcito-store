<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amorcito Store</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;700&display=swap');
    
    :root {
      --pink-bg: #ffe6ef;
      --pink-header: #df588b;
      --pink-soft: #f48fb1;
      --dark-bg: #1a0b2e;
      --text-dark: #333;
    }
    
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--pink-bg);
      overflow-x: hidden;
    }
    
    /* Barra Superior y Header */
    .top-bar {
      background: white;
      text-align: center;
      padding: 12px;
      color: var(--pink-header);
      font-weight: 600;
      letter-spacing: 1px;
    }
    
    .hero-banner {
      background: linear-gradient(135deg, var(--pink-soft), var(--pink-header));
      color: white;
      text-align: center;
      padding: 50px 20px;
    }
    
    .hero-banner h1 {
      font-size: 2.5rem;
      margin: 0 0 10px;
      font-weight: 700;
    }
    
    .hero-banner p {
      font-size: 1rem;
      margin: 0;
      opacity: 0.9;
    }
    
    /* Sección de Juegos */
    .games-section {
      text-align: center;
      padding: 40px 20px;
    }
    
    .cursive-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      color: var(--pink-header);
      margin-bottom: 20px;
    }
    
    .btn-catalog {
      background: white;
      color: var(--pink-header);
      border: 1px solid var(--pink-soft);
      padding: 12px 30px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(223, 88, 139, 0.2);
      margin-bottom: 40px;
    }
    
    /* Tarjetas */
    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      width: 260px;
      text-align: left;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    
    .card-img {
      width: 100%;
      height: 130px;
      background: #f0f0f0;
      border-radius: 12px;
      margin-bottom: 12px;
      object-fit: cover;
    }
    
    .card h3 {
      margin: 0 0 8px;
      color: var(--pink-header);
      font-size: 1.3rem;
    }
    
    .badge {
      background: var(--pink-bg);
      color: var(--pink-header);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .btn-play {
      display: block;
      text-align: center;
      background: white;
      color: var(--pink-header);
      border: 1px solid var(--pink-bg);
      padding: 10px;
      border-radius: 20px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(223, 88, 139, 0.2);
    }
    
    /* Transición de Ondas hacia la Mansión */
    .waves {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: -5px; /* Elimina espacio en blanco inferior */
    }
    
    .mansion-section {
      background: var(--dark-bg);
      background-image: radial-gradient(circle at center, #512b81 0%, var(--dark-bg) 70%);
      color: white;
      text-align: center;
      padding: 80px 20px;
      min-height: 400px;
    }
    
    .mansion-section h2 {
      font-family: 'Creepster', system-ui; /* Requiere importar fuente spooky si deseas */
      font-size: 4rem;
      margin-bottom: 30px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 3px 3px 10px rgba(0,0,0,0.8);
    }
    
    .btn-enter {
      background: #8e44ad;
      color: black;
      border: 3px solid black;
      padding: 15px 50px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 4px 4px 0px black;
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">INICIO</div>
  
  <!-- Encabezado -->
  <header class="hero-banner">
    <h1>Un lugarcito hecho con mucho amor ♥</h1>
    <p>Historias, preguntas y sorpresas para compartir juntos.</p>
  </header>
  
  <!-- Catálogo de Juegos -->
  <section class="games-section">
    <div class="cursive-title">Pequeños juegos hechos para nosotros ♥</div>
    <button class="btn-catalog">Catálogo de juegos</button>
    
    <div class="cards-grid">
      <!-- Tarjeta 1 -->
      <div class="card">
        <div class="card-img" style="background-image: url('imagen-san-valentin.jpg'); background-size: cover;"></div>
        <h3>San Valentín</h3>
        <div class="badge">♥ Primero en esta página</div>
        <a href="#" class="btn-play">Jugar</a>
      </div>
      
      <!-- Tarjeta 2 -->
      <div class="card">
        <div class="card-img" style="background-image: url('imagen-primavera.jpg'); background-size: cover;"></div>
        <h3>Primavera del amor</h3>
        <div class="badge">♥ Más reciente</div>
        <a href="#" class="btn-play">Jugar</a>
      </div>
    </div>
  </section>

  <!-- Transición de Ondas SVG -->
  <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
    <path fill="#d84572" fill-opacity="1" d="M0,128L48,138.7C96,149,192,171,288,160C384,149,480,107,576,112C672,117,768,171,864,181.3C960,192,1056,160,1152,138.7C1248,117,1344,107,1392,101.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    <path fill="#7a285c" fill-opacity="1" d="M0,224L48,229.3C96,235,192,245,288,234.7C384,224,480,192,576,176C672,160,768,160,864,170.7C960,181,1056,203,1152,202.7C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    <path fill="#2a1145" fill-opacity="1" d="M0,288L48,272C96,256,192,224,288,218.7C384,213,480,235,576,245.3C672,256,768,256,864,245.3C960,235,1056,213,1152,208C1248,203,1344,213,1392,218.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
  </svg>

  <!-- Sección Mansión Oscura -->
  <section class="mansion-section">
    <h2>ENTRAR EN LA<br>MANSIÓN</h2>
    <button class="btn-enter">Entrar</button>
  </section>

</body>
</html>
