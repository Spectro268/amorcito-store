<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amorcito Store</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Dancing+Script:wght@700&display=swap');

    /* Carga de Fuentes Locales */
    @font-face {
      font-family: 'Ananias';
      src: url('Ananias.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    
    @font-face {
      font-family: 'Shlop';
      src: url('shlop.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --pink-bg: #ffe6ef;
      --pink-header: #df588b;
      --pink-soft: #f48fb1;
      --pink-gradient-light: #ffebf3;
      --dark-bg: #1a0b2e;
      --text-dark: #333;
    }
    
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: var(--pink-bg);
      overflow-x: hidden;
    }
    
    /* -------------------------------------------
       BARRA SUPERIOR FIJA (STICKY)
       ------------------------------------------- */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(to bottom, var(--pink-gradient-light) 0%, white 100%);
      text-align: center;
      padding: 15px 20px;
      color: var(--pink-header);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(223, 88, 139, 0.15);
    }

    .top-bar-title {
      font-family: 'Ananias', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin: 0;
    }

    /* Ícono de Campana Matemático */
    .notification-btn {
      position: absolute;
      left: 20px;
      background: white;
      color: var(--pink-header);
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(223, 88, 139, 0.2);
      transition: transform 0.2s, background 0.2s;
    }
    .notification-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--pink-header);
    }
    .notification-btn:hover { 
      transform: scale(1.05); 
      background: var(--pink-bg);
    }

    /* -------------------------------------------
       ENCABEZADO: BURBUJAS FLOTANTES
       ------------------------------------------- */
    .hero-banner {
      position: relative;
      background: linear-gradient(135deg, var(--pink-soft), var(--pink-header));
      color: white;
      text-align: center;
      padding: 60px 20px;
      overflow: hidden;
    }
    
    .hero-banner h1 {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      margin: 0 0 10px;
      font-weight: 800;
      position: relative;
      z-index: 2;
    }
    
    .hero-banner p {
      font-size: 1.1rem;
      margin: 0;
      opacity: 0.95;
      position: relative;
      z-index: 2;
    }

    /* Burbujas Suaves de Fondo */
    .circle-deco {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      animation: floatSmooth 12s ease-in-out infinite alternate;
    }
    
    .circle-1 {
      width: 300px;
      height: 300px;
      top: -50px;
      left: -100px;
    }
    
    .circle-2 {
      width: 250px;
      height: 250px;
      bottom: -80px;
      right: -50px;
      animation-duration: 15s;
      animation-delay: -5s;
    }

    @keyframes floatSmooth {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.05); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }
    
    /* -------------------------------------------
       CATÁLOGO DE JUEGOS
       ------------------------------------------- */
    .games-section {
      text-align: center;
      padding: 60px 20px 0px;
      position: relative;
    }
    
    .cursive-title {
      font-family: 'Dancing Script', cursive;
      font-size: 3.5rem;
      color: var(--pink-header);
      margin-bottom: 25px;
    }
    
    /* Etiqueta de Catálogo (Estática, sin hover) */
    .btn-catalog {
      display: inline-block;
      background: white;
      color: var(--pink-header);
      border: 1px solid var(--pink-bg);
      padding: 12px 35px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(223, 88, 139, 0.15);
      margin-bottom: 50px;
      pointer-events: none; /* Inhabilita clicks y hover */
    }
    
    /* Tarjetas Originales */
    .cards-grid {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      width: 280px;
      text-align: left;
      box-shadow: 0 10px 25px rgba(223, 88, 139, 0.1);
      transition: transform 0.3s ease;
    }
    
    .card:hover { transform: translateY(-5px); }
    
    .card-img {
      width: 100%;
      height: 140px;
      background: #f0f0f0;
      border-radius: 12px;
      margin-bottom: 15px;
      object-fit: cover;
    }
    
    .card h3 {
      margin: 0 0 10px;
      color: var(--pink-header);
      font-size: 1.4rem;
      font-weight: 800;
    }
    
    .badge {
      background: var(--pink-bg);
      color: var(--pink-header);
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 15px;
      display: inline-block;
      margin-bottom: 20px;
      font-weight: 700;
    }
    
    .btn-play {
      display: block;
      text-align: center;
      background: white;
      color: var(--pink-header);
      border: 2px solid var(--pink-bg);
      padding: 12px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(223, 88, 139, 0.1);
      transition: all 0.2s;
    }
    
    .btn-play:hover {
      background: var(--pink-header);
      color: white;
      border-color: var(--pink-header);
    }
    
    /* -------------------------------------------
       TRANSICIÓN SÓLIDA DE ONDAS (Sin degradados rectos)
       ------------------------------------------- */
    .waves-container {
      width: 100%;
      line-height: 0;
      font-size: 0;
      margin-top: -20px;
      margin-bottom: -5px;
    }
    
    .waves {
      display: block;
      width: 100%;
      height: auto;
    }
    
    /* -------------------------------------------
       MANSIÓN OSCURA
       ------------------------------------------- */
    .mansion-section {
      background-color: var(--dark-bg);
      background-image: url('casaembrujada.png');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
      color: white;
      text-align: center;
      padding: 100px 20px 120px;
      position: relative;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Solo se oscurece ligeramente para que el texto resalte, sin líneas rectas arriba */
    .mansion-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 1;
    }
    
    .mansion-content {
      position: relative;
      z-index: 2;
    }

    /* Título con la fuente Shlop */
    .mansion-section h2 {
      font-family: 'Shlop', system-ui;
      font-size: clamp(4rem, 9vw, 6rem);
      margin-bottom: 30px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 3px 3px 8px rgba(0,0,0,0.8), -2px -2px 5px rgba(142, 68, 173, 0.6);
    }
    
    /* Botón al estilo de tu imagen de referencia */
    .btn-enter {
      background: #9b59b6; 
      color: #000;
      border: 4px solid #111; 
      padding: 12px 50px;
      font-size: 1.8rem;
      cursor: pointer;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
      transition: all 0.2s;
      font-family: 'Shlop', system-ui;
      letter-spacing: 2px;
    }

    .btn-enter:hover {
      background: #8e44ad;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <div class="top-bar">
    <!-- Ícono SVG de la Campana Matemática -->
    <button class="notification-btn" aria-label="Notificaciones">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22C13.1 22 14 21.1 14 20H10C10 21.1 10.9 22 12 22ZM18 16V11C18 7.93 16.36 5.36 13.5 4.68V4C13.5 3.17 12.83 2.5 12 2.5C11.17 2.5 10.5 3.17 10.5 4V4.68C7.63 5.36 6 7.92 6 11V16L4 18V19H20V18L18 16Z"/>
      </svg>
    </button>
    <h2 class="top-bar-title">INICIO</h2>
  </div>
  
  <!-- Encabezado con Burbujas -->
  <header class="hero-banner">
    <div class="circle-deco circle-1"></div>
    <div class="circle-deco circle-2"></div>
    
    <h1>AMORCITO STORE</h1>
    <p>Historias, preguntas y sorpresas para compartir juntos.</p>
  </header>
  
  <!-- Catálogo de Juegos -->
  <section class="games-section">
    <div class="cursive-title">Pequeños juegos hechos para nosotros ♥</div>
    
    <!-- Etiqueta decorativa inactiva -->
    <div class="btn-catalog">Catálogo de juegos</div>
    
    <div class="cards-grid">
      <!-- Tarjeta 1 -->
      <div class="card">
        <div class="card-img" style="background-image: url('imagen-san-valentin.jpg'); background-size: cover; background-position: center;"></div>
        <h3>San Valentín</h3>
        <div class="badge">♥ Primero en esta página</div>
        <a href="#" class="btn-play">Jugar</a>
      </div>
      
      <!-- Tarjeta 2 -->
      <div class="card">
        <div class="card-img" style="background-image: url('imagen-primavera.jpg'); background-size: cover; background-position: center;"></div>
        <h3>Primavera del amor</h3>
        <div class="badge">♥ Más reciente</div>
        <a href="#" class="btn-play">Jugar</a>
      </div>
    </div>
  </section>

  <!-- Ondas Sólidas conectando los mundos (Sin espacio blanco ni degradados) -->
  <div class="waves-container">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <!-- Onda 1: Rosa oscuro -->
      <path fill="#d84572" fill-opacity="1" d="M0,128L48,138.7C96,149,192,171,288,160C384,149,480,107,576,112C672,117,768,171,864,181.3C960,192,1056,160,1152,138.7C1248,117,1344,107,1392,101.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      <!-- Onda 2: Morado -->
      <path fill="#7a285c" fill-opacity="1" d="M0,224L48,229.3C96,235,192,245,288,234.7C384,224,480,192,576,176C672,160,768,160,864,170.7C960,181,1056,203,1152,202.7C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
      <!-- Onda 3: El color de fondo oscuro de la mansión conectando abajo -->
      <path fill="#1a0b2e" fill-opacity="1" d="M0,288L48,272C96,256,192,224,288,218.7C384,213,480,235,576,245.3C672,256,768,256,864,245.3C960,235,1056,213,1152,208C1248,203,1344,213,1392,218.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>

  <!-- Sección Mansión -->
  <section class="mansion-section">
    <div class="mansion-overlay"></div>
    <div class="mansion-content">
      <h2>ENTRAR EN LA<br>MANSIÓN</h2>
      <button class="btn-enter">Entrar</button>
    </div>
  </section>

</body>
</html>
